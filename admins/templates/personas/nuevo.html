
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva persona</title>
</head>
<body>
    <h3>Nueva persona</h3>

    <form action="{% url 'nueva_persona' %}" method="post">
        {% csrf_token %}

        Cedula de Identidad: <input type="text" name="ci" required maxlength="10"><br>
        Nombre: <input type="text" name="nombre" required maxlength="50"><br>
        Apellido: <input type="text" name="apellido" required maxlength="50"><br>
        Dirección: <input type="text" name="direccion" required maxlength="100"><br>
        Teléfono: <input type="text" name="telefono" required maxlength="9"><br>
        Fecha de nacimiento: <input type="date" name="fecha_nacimiento" value="2026-11-16"><br>
        Correo electrónico: <input type="email" name="email" required maxlength="50"><br>

        <button type="submit">..::Guardar::..</button>
        <button type="reset">..::Borrar::..</button>
        <a href="{% url 'index_personas' %}">..::Cancelar::..</a>
    </form>
</body>
</html>
